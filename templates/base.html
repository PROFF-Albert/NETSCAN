<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}NETSCAN{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/assessment.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to dashboard content</a>
  <aside>
    <div class="brand"><span>◈</span> NETSCAN</div>
    <nav>
      <a href="/" {% raw %}{% if request.path == '/' %}class="active"{% endif %}{% endraw %}>▦ Dashboard</a>
      <a href="/#devices">⌁ Devices</a>
      <a href="/open-ports">⌁ Open ports</a>
      <a href="/#reports">⇩ Reports</a>
      <a href="/#settings">⚙ Settings</a>
    </nav>
    <div class="side-foot">LOCAL NETWORK<br><b>● Monitoring active</b></div>
  </aside>
  <main id="main-content">
    {% block heading %}{% endblock %}
    {% block content %}{% endblock %}
  </main>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/static/app.js"></script>
</body>
</html>
