{% extends 'base.html' %}{% block heading %}Settings{% endblock %}{% block content %}<section class="panel form-panel"><div class="panel-head"><h2>Monitoring configuration</h2><span>Saved in local SQLite</span></div><form id="settings-form"><label>Authorized private network range<input required name="network_range" placeholder="192.168.1.0/24"></label><label>Monitoring interval (seconds)<input required type="number" min="30" max="3600" name="scan_interval"></label><label>Ping timeout (seconds)<input required type="number" min="0.1" max="10" step="0.1" name="ping_timeout"></label><label>Dashboard refresh (seconds)<input required type="number" min="5" max="3600" name="refresh_rate"></label><p class="small">Discovery is limited to private networks no larger than 1,024 addresses. Settings do not launch a scan.</p><button class="primary">Save settings</button></form></section>{% endblock %}
